name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal_test
          MYSQL_USER: portal
          MYSQL_PASSWORD: portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
      # Pretend target server for the SSH tests
      sshd:
        image: lscr.io/linuxserver/openssh-server:latest
        env:
          PASSWORD_ACCESS: 'true'
          USER_NAME: deploy
          USER_PASSWORD: deploy-test-only
          PUBLIC_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINXI6KroznWVVSXIYwlgwLZlqnycRBiLD3ZaxQVNdaoD deploy-portal-test-only
        ports:
          - 2222:2222

    env:
      TEST_DATABASE_URL: mysql://portal:portal@127.0.0.1:3306/portal_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/1

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The sshd container takes a few seconds to start sshd; the SSH and deploy tests need it.
      - name: Wait for the sshd test container
        run: |
          for i in $(seq 1 60); do
            ssh-keyscan -p 2222 127.0.0.1 >/dev/null 2>&1 && echo "sshd is up" && exit 0
            sleep 2
          done
          echo "sshd did not start" && docker ps -a && exit 1

      # Locally, docker/sshd/Dockerfile adds git and bash to the sshd image; do the same here.
      - name: Add git and bash to the sshd container
        run: |
          id=$(docker ps -q --filter "ancestor=lscr.io/linuxserver/openssh-server:latest")
          test -n "$id" || { echo "sshd container not found"; docker ps; exit 1; }
          docker exec "$id" apk add --no-cache git bash

      - run: npm test

