# Exposes the API pods. `minikube service portal-api --url` prints the address.
apiVersion: v1
kind: Service
metadata:
  name: portal-api
spec:
  type: NodePort
  selector: { app: portal-api }
  # Socket.IO's first connection steps must reach the same pod, so keep each browser on one pod.
  sessionAffinity: ClientIP
  ports:
    - port: 80
      targetPort: 4000
      nodePort: 30080
